<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Quest — Learn Computers by Playing</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>🎮 ICT Quest</h1>
  <div id="nav-area">
    <span id="user-label" hidden></span>
    <button id="progress-btn" hidden>My Progress</button>
    <button id="logout-btn" hidden>Log out</button>
  </div>
</header>

<main id="app">

  <!-- HOME / LOGIN SCREEN -->
  <section id="home-screen">
    <div class="hero">
      <h2>Learn computers. Play the game. 🏆</h2>
      <p>Five levels: Computer Basics, Word, Excel, PowerPoint and Internet &amp; Email. Answer questions, earn stars, beat your best score!</p>
    </div>

    <div id="message" class="message" hidden></div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Log in</button>
        <button class="tab" data-tab="register">New account</button>
      </div>

      <form id="login-form">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" required>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button type="submit" class="primary">Log in</button>
      </form>

      <form id="register-form" hidden>
        <label for="reg-username">Choose a username</label>
        <input id="reg-username" type="text" autocomplete="username" required>
        <label for="reg-password">Choose a password (4+ letters/numbers)</label>
        <input id="reg-password" type="password" autocomplete="new-password" required>
        <label for="reg-role">I am a…</label>
        <select id="reg-role">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
        <button type="submit" class="primary">Create account</button>
      </form>
    </div>
  </section>

  <!-- LEVEL SELECT SCREEN -->
  <section id="levels-screen" hidden>
    <h2 id="levels-title">Pick a level</h2>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="quiz-screen" hidden>
    <div class="progress-bar"><div id="quiz-progress"></div></div>
    <h2 id="quiz-title"></h2>
    <div id="quiz-body"></div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="result-screen" hidden>
    <div id="result-card" class="card"></div>
    <button id="back-to-levels" class="primary">Back to levels</button>
  </section>

  <!-- PROGRESS SCREEN -->
  <section id="progress-screen" hidden>
    <h2 id="progress-title"></h2>
    <div id="progress-body" class="card"></div>
    <button id="progress-back" class="primary">Back</button>
  </section>

</main>

<footer><small>ICT Quest — a learning game for basic computer skills. Runs offline.</small></footer>
<script src="/app.js"></script>
</body>
</html>
